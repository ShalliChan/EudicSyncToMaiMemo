name: MaiMemo Read-only Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose MaiMemo (GET only)
        shell: pwsh
        run: ./scripts/diagnose-maimemo.ps1
        env:
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
          MAIMEMO_CONTENT_AUDIT: 'true'
          MAIMEMO_STRICT_PREVIEW: 'true'
          MAIMEMO_TITLE_AUDIT: 'true'
          MAIMEMO_SOURCE_AUDIT: 'true'
          EUDIC_AUTHORIZATION: ${{ secrets.EUDIC_AUTHORIZATION }}
          EUDIC_BOOK_ID: ${{ secrets.EUDIC_BOOK_ID }}
