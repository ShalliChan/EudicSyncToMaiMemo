name: MaiMemo Read-only Diagnostics

on:
  workflow_dispatch:
    inputs:
      difference_audit:
        description: 'Only audit the three non-source body titles (GET only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maimemo-user-authorization
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OAuth dependencies
        working-directory: scripts/maimemo-oauth
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose MaiMemo (GET only)
        run: node scripts/maimemo-oauth/run-sync.mjs --diagnose
        env:
          MAIMEMO_OIDC_CREDENTIALS: ${{ secrets.MAIMEMO_OIDC_CREDENTIALS }}
          MAIMEMO_CONTENT_AUDIT: 'true'
          MAIMEMO_DIFFERENCE_AUDIT: ${{ inputs.difference_audit }}
          MAIMEMO_STRICT_PREVIEW: 'true'
          MAIMEMO_TITLE_AUDIT: 'true'
          MAIMEMO_SOURCE_AUDIT: 'true'
          EUDIC_AUTHORIZATION: ${{ secrets.EUDIC_AUTHORIZATION }}
          EUDIC_BOOK_ID: ${{ secrets.EUDIC_BOOK_ID }}
